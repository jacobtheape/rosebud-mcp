services:
  - type: web
    name: rosebud-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ROSEBUD_API_KEY
        generateValue: true
      - key: ROSEBUD_CHECKOUT_MODE
        value: fake
      - key: ROSEBUD_FLORIST
        value: teleflora
      - key: ROSEBUD_STORE
        value: memory
      # Production: switch ROSEBUD_STORE to postgres and attach a managed
      # database, then set DATABASE_URL from the database resource:
      # - key: ROSEBUD_STORE
      #   value: postgres
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: rosebud-db
      #     property: connectionString
